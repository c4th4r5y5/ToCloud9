apiVersion: apps/v1
kind: Deployment
metadata: {{ $fullname := printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
  name: {{ $fullname }}-servers-registry
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  selector:
    matchLabels:
      app: {{ $fullname }}-servers-registry
  replicas: {{ default 1 .Values.servers_registry.replicaCount | int }}
  template:
    metadata:
      labels:
        app: {{ $fullname }}-servers-registry
    spec:
      containers:
      - name: {{ .Release.Name }}-servers-registry
        image: "{{ .Values.servers_registry.image.repository }}:{{ .Values.servers_registry.image.tag }}"
        imagePullPolicy: {{ .Values.servers_registry.image.pullPolicy | toString }}
        env:
        - name: PORT
          value: "{{ .Values.servers_registry.service.internalPort | int }}"
        - name: REDIS_URL
          value: redis://{{ .Release.Name }}-redis-headless:6379/0
        - name: NATS_URL
          value: nats://{{ .Release.Name }}-nats:4222
        - name: LAYER_MAPS
          value: "{{- range $index, $map := .Values.servers_registry.layering.maps }}{{ if $index }};{{ end }}{{ $map.mapID }}:{{ $map.layers }}{{- end }}"
        - name: HEALTH_CHECK_PORT
          value: "8900"
        - name: HEALTH_CHECK_GRACE_PERIOD_SECS
          value: {{ default 180 .Values.servers_registry.healthCheckGracePeriodSecs | quote }}
        ports:
        - containerPort: {{ .Values.servers_registry.service.internalPort | int  }}
        - containerPort: 8900
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8900
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8900
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
          # runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
{{ toYaml .Values.resources | indent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-servers-registry
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  type: {{ .Values.servers_registry.service.type }}
  ports:
  - port: {{ .Values.servers_registry.service.externalPort | int  }}
    targetPort: {{ .Values.servers_registry.service.internalPort | int  }}
    protocol: TCP
  selector:
    app: {{ $fullname }}-servers-registry

---
# Only the registry's single replica knows the live game-server set; losing
# it to a voluntary disruption (node drain, cluster-autoscaler) rather than
# an actual health failure would cause the exact "can't find an instance"
# symptom this chart's probes are meant to catch. This blocks voluntary
# evictions of the pod unless a replacement is already available.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-servers-registry
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $fullname }}-servers-registry
